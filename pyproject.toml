[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodwe-exporter"
version = "0.1.0"
description = "Prometheus exporter for GoodWe solar inverters"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "goodwe==0.4.10",
    "prometheus-client>=0.20,<1",
    "aiohttp>=3.14.5,<4",
]

[project.scripts]
goodwe-exporter = "goodwe_exporter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
